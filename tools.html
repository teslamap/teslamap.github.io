<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Lightweight Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        #map { width: 100%; height: 100%; background: #ffffff; }

        /* რუკის ფერი - სრულიად თეთრი ფონი, წარწერების გარეშე და ინვერსიული კონტურები */
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(1.2) contrast(0.9); }

        .locate-btn {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 50px; height: 50px;
            font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex; align-items: center; justify-content: center;
        }

        .leaflet-control-attribution { display: none !important; }
        
        .tesla-icon {
            width: 30px; height: 55px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200"><path d="M20,40 Q50,10 80,40 L85,150 Q50,190 15,150 Z" fill="%23cc0000" stroke="%23111" stroke-width="4"/><path d="M25,55 Q50,30 75,55 L72,80 Q50,70 28,80 Z" fill="%23222"/><path d="M28,110 Q50,100 72,110 L70,140 Q50,150 30,140 Z" fill="%23222"/><circle cx="20" cy="170" r="6" fill="%23ff0000"/><circle cx="80" cy="170" r="6" fill="%23ff0000"/><circle cx="25" cy="30" r="5" fill="%23ffffff"/><circle cx="75" cy="30" r="5" fill="%23ffffff"/></svg>');
            background-size: contain; background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="locate-btn" onclick="goToMyLocation()" title="ჩემი მდებარეობა">📍</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let myLocation = [41.6434, 41.6399]; // საწყისი წერტილი (ბათუმი)
        let destMarker = null;
        let routeLine = null;

        const map = L.map('map', { 
            zoomControl: false,
            attributionControl: false 
        }).setView(myLocation, 15);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        // სრულიად ცარიელი რუკა წარწერების გარეშე
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        const teslaIcon = L.divIcon({ className: 'tesla-icon', iconSize: [30, 55], iconAnchor: [15, 27] });
        let myMarker = L.marker(myLocation, { icon: teslaIcon }).addTo(map);

        // რუკაზე დაკლიკებით პინის დასმა და ხაზის გაბმა
        map.on('click', async e => {
            const dest = [e.latlng.lat, e.latlng.lng];
            
            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker(dest, { draggable: true }).addTo(map);

            destMarker.on('dragend', ev => {
                const pos = ev.target.getLatLng();
                calculateRoute(myLocation, [pos.lat, pos.lng]);
            });

            calculateRoute(myLocation, dest);
        });

        // მარშრუტის გამოთვლა
        async function calculateRoute(start, end) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (routeLine) map.removeLayer(routeLine);
                    routeLine = L.polyline(coords, { color: '#007aff', weight: 6, opacity: 0.9 }).addTo(map);
                }
            } catch (err) {
                console.error("Route error:", err);
            }
        }

        // მიმდინარე მდებარეობაზე გადასვლა
        function goToMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    myLocation = [pos.coords.latitude, pos.coords.longitude];
                    myMarker.setLatLng(myLocation);
                    map.setView(myLocation, 15, { animate: true });
                }, null, { enableHighAccuracy: true });
            }
        }

        goToMyLocation();
    </script>
</body>
</html>
