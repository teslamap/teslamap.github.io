<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Hub - მთავარი</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #000000; 
            color: #ffffff; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 600px; 
            background: #111111; 
            padding: 40px; 
            border-radius: 14px; 
            border: 1px solid #222222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            text-align: center;
        }
        h1 { 
            margin-top: 0; 
            color: #fff; 
            font-weight: 400;
            letter-spacing: 1.5px;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #86868b;
            font-size: 15px;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .nav-btn { 
            background: #1a1a1a; 
            color: white; 
            border: 1px solid #333; 
            padding: 16px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 500; 
            font-size: 16px; 
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        .nav-btn:hover { 
            background: #e82127; 
            border-color: #e82127;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 30px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>მოგესალმებით, Tesla მფლობელო</h1>
        <div class="subtitle">აირჩიეთ სასურველი ინსტრუმენტი ან სისტემა</div>
        
        <div class="nav-grid">
            <!-- ღილაკი 1: გადადის vin.html-ზე (სადაც შენი დეკოდერია ჩასადები) -->
            <a href="vin.html" class="nav-btn">VIN დეკოდერი და სკანერი</a>

            <!-- ღილაკი 2: გადადის diagnostics.html-ზე -->
            <a href="diagnostics.html" class="nav-btn">სერვის დიაგნოსტიკა და ბატარეა</a>

            <!-- ღილაკი 3: გადადის routes.html-ზე -->
            <a href="routes.html" class="nav-btn">მარშრუტები და ნავიგაცია</a>

            <!-- ღილაკი 4: გადადის tools.html-ზე -->
            <a href="tools.html" class="nav-btn">დამხმარე ინსტრუმენტები</a>
        </div>

        <div class="footer-note">Tesla Ecosystem Hub &bull; GitHub Pages</div>
    </div>

</body>
</html>
