<script>
const projects=[["Tesla Energy Navigator", "https://teslamap.github.io/suloanani1-cmd.github.io/navigation.html", "https://github.com/teslamap/suloanani1-cmd.github.io", "Maps · Energy · Tesla"], ["Makasia (e-Commerce)", "https://teslamap.github.io/maku/", "https://github.com/teslamap/maku", "Store · Admin · Mobile"], ["Garanti Group", "https://teslamap.github.io/garanti-group/", "https://github.com/teslamap/garanti-group", "Construction · AI Chat"], ["Metalo", "https://github.com/teslamap/metalo", "https://github.com/teslamap/metalo", "Desktop App · Design"], ["Laptop Finder", "https://github.com/teslamap", "https://github.com/teslamap", "Shopping · Comparison"], ["Tesla AI Scout", "https://github.com/teslamap/tesla-ai-scout", "https://github.com/teslamap/tesla-ai-scout", "Tesla · AI · Auction"], ["3D Puzzle Game", "https://github.com/teslamap", "https://github.com/teslamap", "Game · 3D"], ["Various Tools", "https://github.com/teslamap", "https://github.com/teslamap", "Utilities · Tools"]];
const mobileIcons=['⚡','🛍️','🏗️','▣','💻','🚘','🎮','⚙️'];
const grid=document.getElementById('mobileGrid');
function renderMobile(q=''){
grid.replaceChildren();projects.forEach((p,i)=>{
if(!(p[0]+' '+p[3]).toLowerCase().includes(q.toLowerCase()))return;
const card=document.createElement('article');card.className='mobile-card';
const thumb=document.createElement('div');thumb.className='thumb';thumb.textContent=mobileIcons[i];
const info=document.createElement('div');info.className='info';
const title=document.createElement('h2');title.textContent=p[0];
const desc=document.createElement('p');desc.textContent=p[3];
const actions=document.createElement('div');actions.className='mobile-actions';
for(const [label,url] of [['Open Project ↗',p[1]],['GitHub',p[2]]]){const a=document.createElement('a');a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener noreferrer';actions.append(a)}
info.append(title,desc,actions);card.append(thumb,info);grid.append(card);
});}
renderMobile();document.getElementById('mobileSearch').addEventListener('input',e=>renderMobile(e.target.value));
const ds=document.getElementById('desktopSearch'),dr=document.getElementById('desktopResults');
ds.addEventListener('input',()=>{const q=ds.value.trim().toLowerCase();dr.replaceChildren();if(!q){dr.classList.remove('visible');return}const matches=projects.filter(p=>(p[0]+' '+p[3]).toLowerCase().includes(q));matches.forEach(p=>{const a=document.createElement('a');a.textContent=p[0]+' ↗';a.href=p[1];a.target='_blank';a.rel='noopener noreferrer';dr.append(a)});if(!matches.length){const d=document.createElement('a');d.textContent='No matching projects';dr.append(d)}dr.classList.add('visible')});
document.addEventListener('click',e=>{if(e.target!==ds&&!dr.contains(e.target))dr.classList.remove('visible')});
</script>
